name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rfq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt

      - name: Run migration check
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-secret
          SEED_DEMO_USERS: "false"
        run: python -m alembic upgrade head

      - name: Run backend tests
        env:
          SECRET_KEY: ci-secret
          SEED_DEMO_USERS: "true"
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/rfq_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m pytest backend/tests

      - name: Audit backend dependencies
        run: python -m pip_audit --disable-pip --no-deps -r backend/requirements.txt

      - name: Build backend image
        run: docker build -t rfq-ci ./backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm run test

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level=high
