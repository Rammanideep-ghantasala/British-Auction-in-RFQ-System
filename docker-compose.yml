services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: british_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/british_auction
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: local-docker-secret-change-before-deploy
      SEED_DEMO_USERS: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app worker -l info
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/british_auction
      SECRET_KEY: local-docker-secret-change-before-deploy
      SEED_DEMO_USERS: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/british_auction
      SECRET_KEY: local-docker-secret-change-before-deploy
      SEED_DEMO_USERS: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
