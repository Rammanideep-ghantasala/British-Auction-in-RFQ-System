services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: british_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d british_auction"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/british_auction
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: local-docker-secret-change-before-deploy
      SEED_DEMO_USERS: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app worker -l info
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/british_auction
      SECRET_KEY: local-docker-secret-change-before-deploy
      SEED_DEMO_USERS: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/british_auction
      SECRET_KEY: local-docker-secret-change-before-deploy
      SEED_DEMO_USERS: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres_data:
