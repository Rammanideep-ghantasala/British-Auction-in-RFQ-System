services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: british_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/british_auction
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: local-docker-secret-change-before-deploy
      SEED_DEMO_USERS: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
